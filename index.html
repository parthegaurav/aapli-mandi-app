<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO & Brand -->
    <title>आपली मंडी (Aapli Mandi) — FreshRoute Agri Logistics</title>
    <meta name="description" content="आपली मंडी (Aapli Mandi) — शिवार ते मार्केट यार्ड अवघ्या ६ ते १० तासांत १००% ग्रेडिंग केलेला शेतमाल थेट विक्री" />
    <meta name="application-name" content="आपली मंडी" />

    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#15803d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="आपली मंडी" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-gray-900 antialiased selection:bg-agri-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for PWA Offline & Installability -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Aapli Mandi PWA ServiceWorker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
